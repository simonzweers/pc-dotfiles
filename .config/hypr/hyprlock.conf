
bezier = linear, 1, 1, 0, 0
bezier = easeOutQuint,0.23,1,0.32,1

animations {
	enabled = yes
    animation = fade, 1, 10, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
}

# Password Input
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.5) # no fill

    outer_color = rgb(143, 143, 143) rgba(707880ee) 45deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgba(C5C8C6ee)
    fade_on_empty = false
    rounding = 15

    position = 200, -80
    halign = left
    valign = center
}

background {
	monitor =
	# path = ~/wallpapers/ghibli-1.jpg
	path = screenshot
	blur_size = 7
	blur_passes = 3
	color = rgba(0, 0, 0, 0.5)
}

#Fortune
label {
    monitor =
    text = cmd[update:30000] cowsay -f $(cowsay -l | shuf -n1) "$(fortune -s -n 200)"

    color = rgba(200, 200, 200, 1.0)
    font_size = 10
    font_family = CaskaydiaCoveNerdFont

    position = -200, 0
    halign = right
    valign = center
}

#Clock
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 150
    font_family = CaskaydiaCoveNerdFont

    position = 200, 80
    halign = left
    valign = center
}
