
bezier = linear, 1, 1, 0, 0
bezier = easeOutQuint,0.23,1,0.32,1

animations {
	enabled = yes
    animation = fade, 1, 10, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
}

# Password Input
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(40, 40, 40, 0.7) # gruvbox bg, translucent

    outer_color = rgba(fabd2fee) rgba(fe8019ee) 45deg # gruvbox yellow -> orange
    check_color = rgba(8ec07cee) rgba(b8bb26ee) 120deg # gruvbox aqua -> green
    fail_color = rgba(fb4934ee) rgba(fe8019ee) 40deg # gruvbox red -> orange

    font_color = rgba(ebdbb2ee) # gruvbox fg
    fade_on_empty = false
    rounding = 15

    position = 200, -80
    halign = left
    valign = center
}

background {
	monitor =
	# path = ~/wallpapers/ghibli-1.jpg
	path = screenshot
	blur_size = 7
	blur_passes = 3
	color = rgba(40, 40, 40, 0.5) # gruvbox bg
}

#Fortune
label {
    monitor =
    text = cmd[update:30000] cowsay -f $(cowsay -l | shuf -n1) "$(fortune -s -n 200)"

    color = rgba(235, 219, 178, 1.0) # gruvbox fg
    font_size = 10
    font_family = CaskaydiaCoveNerdFont

    position = -200, 0
    halign = right
    valign = center
}

#Clock
label {
    monitor =
    text = $TIME
    color = rgba(250, 189, 47, 1.0) # gruvbox yellow
    font_size = 150
    font_family = CaskaydiaCoveNerdFont

    position = 200, 80
    halign = left
    valign = center
}
