
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @plugin 'egel/tmux-gruvbox'

# set -g @kanagawa-theme 'wave'
# set -g @kanagawa-plugins "cpu-usage ram-usage"
# set -g @kanagawa-ignore-window-colors true
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

set -g status-position top

bind -r r source ~/.config/tmux/tmux.conf\; display-message "tmux.conf reloaded."
set -g mouse
set -g base-index 1

# set -g prefix2 C-a
bind C-a send-prefix -2

bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind _ split-window -v # split horizontally
bind | split-window -h # split vertically

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Check for tpm install and install if not
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"



run '~/.tmux/plugins/tpm/tpm'
